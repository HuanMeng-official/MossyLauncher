<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MossyLauncher</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="主导航">
      <div class="rail-brand" title="MossyLauncher" aria-hidden="true">
        <span class="rail-logo">
          <img src="../../assets/logo.png" alt="" draggable="false">
        </span>
      </div>

      <div class="rail-nav" id="nav">
        <button class="rail-item is-active" data-view="home">
          <span class="rail-indicator">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          </span>
          <span class="rail-label">主页</span>
        </button>
        <button class="rail-item" data-view="versions">
          <span class="rail-indicator">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
          </span>
          <span class="rail-label">版本</span>
        </button>
        <button class="rail-item" data-view="accounts">
          <span class="rail-indicator">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
          <span class="rail-label">账号</span>
        </button>
        <button class="rail-item" data-view="settings">
          <span class="rail-indicator">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </span>
          <span class="rail-label">设置</span>
        </button>
      </div>

      <div class="rail-footer">
        <button class="icon-button" id="theme-toggle" title="切换主题" aria-label="切换主题"></button>
      </div>
    </nav>

    <div class="shell">
      <header class="app-bar">
        <h1 class="app-bar-title" id="view-title">MossyLauncher</h1>
      </header>

      <main class="content">
        <section class="view is-active" id="view-home"></section>
        <section class="view" id="view-versions"></section>
        <section class="view" id="view-accounts"></section>
        <section class="view" id="view-settings"></section>
      </main>
    </div>
  </div>

  <div class="progress-pill" id="progress-pill" hidden>
    <div class="progress-pill-head">
      <span class="progress-phase" id="progress-phase">处理中</span>
      <span class="progress-counts" id="progress-counts"></span>
    </div>
    <div class="progress-track" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
